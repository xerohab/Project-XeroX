# ============================================================
# Project XeroX — Database Deployment Policy
# ============================================================
#
# DATABASE PRINCIPLE
#
# Every destination hotel owns its own database and its own data.
#
# Project XeroX is allowed to deliver database STRUCTURE changes
# required by an approved Project XeroX release.
#
# Project XeroX must NEVER use one hotel's database contents as
# deployment payload for another hotel.
#

DATABASE_MODE="MIGRATIONS_ONLY"

# Destination database contents are protected.
PRESERVE_DESTINATION_DATABASE_DATA=1

# Approved Flyway migrations may evolve the destination schema.
ALLOW_APPROVED_SCHEMA_MIGRATIONS=1

# Existing Flyway migrations are immutable.
REQUIRE_IMMUTABLE_MIGRATION_HISTORY=1

# A verified backup of the destination's own database is required
# before any migration-capable Emulator start.
REQUIRE_DATABASE_ROLLBACK_BACKUP=1

# Database backups are rollback artifacts only.
DATABASE_BACKUP_FOR_ROLLBACK_ONLY=1

# Never package or deploy database dumps as release content.
ALLOW_DATABASE_DUMP_AS_RELEASE_PAYLOAD=0

# Never copy source-hotel records into a destination database.
ALLOW_CROSS_HOTEL_DATA_IMPORT=0

# Never replace the destination database wholesale during update.
ALLOW_DATABASE_REPLACEMENT=0

# User/account state must remain destination-owned.
PRESERVE_USERS=1
PRESERVE_USER_SETTINGS=1
PRESERVE_USER_CURRENCIES=1
PRESERVE_USER_INVENTORIES=1
PRESERVE_USER_ACHIEVEMENTS=1
PRESERVE_USER_RELATIONSHIPS=1

# Hotel operational/community data remains destination-owned.
PRESERVE_ROOMS=1
PRESERVE_ROOM_ITEMS=1
PRESERVE_CATALOG_STATE=1
PRESERVE_BANS=1
PRESERVE_MESSAGES=1
PRESERVE_GROUPS=1
PRESERVE_WEBSITE_ACCOUNTS=1

# Schema/support records explicitly created by an approved migration
# are allowed where required for the new XeroX software to function.
#
# Examples:
#   - new tables
#   - new columns
#   - indexes
#   - permission definitions
#   - configuration/schema defaults required by new functionality
#
# These must come from reviewed migration files, not from copying
# another hotel's live database.
ALLOW_MIGRATION_SUPPORT_DATA=1
