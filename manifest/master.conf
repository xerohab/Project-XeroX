PROJECT_NAME="Project XeroX"
PROJECT_ROOT="/var/www/Project-XeroX"
BACKUP_ROOT="/var/backups/Project-XeroX"

# Safety defaults
BACKUP_REQUIRED=1
ROLLBACK_ON_FAILURE=1
PRESERVE_HOTEL_IDENTITY=1
PRESERVE_DATABASE=1
PRESERVE_GAMEDATA=1
PRESERVE_LANDING=1
PRESERVE_LOADING=1
PRESERVE_LOGIN=1
PRESERVE_SECRETS=1

# CMS must remain selective.
CMS_FULL_REPLACE=0

# Gamedata is deliberately outside this updater for now.
MANAGE_GAMEDATA=0

# Database deployment boundary
DATABASE_MIGRATIONS_ONLY=1
PRESERVE_DESTINATION_DATABASE_DATA=1
DATABASE_BACKUP_REQUIRED_BEFORE_MIGRATION=1
CROSS_HOTEL_DATABASE_IMPORT=0
DATABASE_RELEASE_DUMPS_ALLOWED=0
