# Project XeroX destination profile.
#
# Copy this file outside the repository for each destination hotel.
# Never commit passwords, API keys or other credentials.
#
# Application paths
NITRO_ROOT="/var/www/Nitro-V3"
RENDERER_ROOT="/var/www/Nitro_Render_V3"
EMULATOR_ROOT="/var/www/emulator"
CMS_ROOT="/var/www/atomcms"

# Gamedata is intentionally excluded from Project XeroX.
MANAGE_GAMEDATA=0

# Database
DATABASE_NAME="habbo"

# Service handling.
#
# SERVICE_MODE must be explicitly configured before production install.
#
# Supported:
#   systemd
#   pm2
#   supervisor
#   none
#
# "none" requires explicit acknowledgement and means Project XeroX will
# not stop/start an application service.
SERVICE_MODE=""
SERVICE_NAME=""
ALLOW_NO_SERVICE_RESTART=0

# Build controls
BUILD_NITRO=1
BUILD_RENDERER=1
BUILD_EMULATOR=1
BUILD_CMS=0
